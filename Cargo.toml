[package]
name = "genpass"
version = "1.0.0"
edition = "2021"
description = "Password generator with a Rust API and client-side UI generation"
publish = false

[dependencies]
axum = "0.8"
http = "1"
rand = { version = "0.9", features = ["os_rng", "std"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread"] }
tower = "0.5"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
