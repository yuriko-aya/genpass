<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>GenPass - Password Generator</title>
    <meta name="description" content="Secure password generator powered by Flask">
  </head>
  <body>
    <div class="container mt-5">
      <div class="text-center">
        <h1 class="mb-4">GenPass</h1>
        <p class="lead mb-4">Secure Password Generator</p>

        <div class="alert alert-secondary mb-4" role="alert">
          Passwords are generated on the server and sent to your browser over HTTPS.
          They are not stored, but if you need fully local generation, use an offline tool.
        </div>

        <!-- Password Options -->
        <div class="card mb-4" style="max-width: 600px; margin: 0 auto;">
          <div class="card-header">
            <h5 class="mb-0">Password Options</h5>
          </div>
          <div class="card-body text-start">
            <div class="mb-3">
              <label for="password-length" class="form-label">Password Length: <span id="length-display">32</span></label>
              <input type="range" class="form-range" min="8" max="64" value="32" id="password-length">
            </div>

            <div class="mb-3">
              <label class="form-label">Character Types:</label>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="include-uppercase" checked>
                <label class="form-check-label" for="include-uppercase">Uppercase Letters (A-Z)</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="include-lowercase" checked>
                <label class="form-check-label" for="include-lowercase">Lowercase Letters (a-z)</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="include-numbers" checked>
                <label class="form-check-label" for="include-numbers">Numbers (0-9)</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="include-symbols" checked>
                <label class="form-check-label" for="include-symbols">Symbols (!@#$%^&*)</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="add-hyphens" checked>
                <label class="form-check-label" for="add-hyphens">Add hyphens every 8 characters</label>
              </div>
            </div>
          </div>
        </div>

        <button type="button" id="main-button" class="btn btn-primary btn-lg">Generate Password</button>

        <div id="generated_password" class="mt-4"></div>

        <!-- Password Strength Indicator -->
        <div id="password-strength" class="mt-3" style="display: none;">
          <div class="progress" style="height: 8px;">
            <div id="strength-bar" class="progress-bar" role="progressbar" style="width: 0%"></div>
          </div>
          <small id="strength-text" class="text-muted"></small>
        </div>

        <div class="d-grid mt-3">
          <div class="row">
            <div class="col-sm">
              <button id="left-button" type="button" class="btn btn-primary btn-lg left-button" style="display: none;">Generate Another</button>
            </div>
            <div class="col-sm">
              <button id="copy-button" type="button" class="btn btn-success btn-lg" style="display: none;">
                📋 Copy Password
              </button>
            </div>
          </div>
        </div>

        <!-- Quick Access Links -->
        <div class="mt-5">
          <h6>Other Versions:</h6>
          <div class="btn-group" role="group">
            <a href="/v2/" class="btn btn-outline-secondary btn-sm">Version 2</a>
            <a href="/api/" class="btn btn-outline-secondary btn-sm">API v1</a>
            <a href="/api_v2/" class="btn btn-outline-secondary btn-sm">API v2</a>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='js/genpass.js') }}"></script>
    <script src="{{ url_for('static', filename='js/index.js') }}"></script>
  </body>
</html>
